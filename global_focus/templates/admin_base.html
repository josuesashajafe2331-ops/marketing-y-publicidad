<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block titulo %}Panel{% endblock %} | {{ c.empresa }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="adm shell">
<aside class="adm-side">
  <div class="adm-marca"><small>Panel de administración</small><b>{{ c.empresa }}</b></div>
  <nav class="adm-nav" aria-label="Secciones">
    <a class="on" href="{{ url_for('consultas') }}" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l2.1-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg> Consultas
    </a>
  </nav>
  <div class="adm-user">
    <b>{{ usuario.nombre }}</b>
    <small>{{ usuario.correo }}</small>
    <form method="post" action="{{ url_for('logout') }}"><button class="adm-btn sec" type="submit">Cerrar sesión</button></form>
    <a href="/">← Volver a la web</a>
  </div>
</aside>
<main class="adm-main">
{% block contenido %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body></html>
